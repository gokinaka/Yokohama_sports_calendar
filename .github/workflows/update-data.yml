name: Update schedule data

# 各チームの試合日程を取得し、data/ 配下のJSONを更新してコミットする。
# 取得対象は config/teams.json を正とし、scripts/update-all.mjs が順番に実行する。
# 1チームの失敗では止まらず、失敗したチームがあればジョブ全体を失敗させる。
on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 0" # 毎週月曜 JST 3:00 (日曜 UTC 18:00)。GitHubの都合で数時間遅れることがある

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 各チームの日程を取得
        id: fetch
        run: node scripts/update-all.mjs

      # 一部のチームが失敗しても、取得できた分はカレンダーに反映する
      - name: カレンダー用データを統合
        if: always()
        run: node scripts/build-events.mjs

      - name: Commit changes if any
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: update schedule data"
            # 実行中に別のpushがあると弾かれるため、取り込んでから送る
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi
