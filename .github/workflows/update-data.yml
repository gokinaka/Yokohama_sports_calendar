name: Update schedule data

# 各チームの試合日程を取得し、data/ 配下のJSONを更新してコミットする。
# 現時点では横浜F・マリノスのみ対応(PoC)。他チーム対応後はstepを追加する。
on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *" # 毎日 JST 3:00 (UTC 18:00)

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fetch 横浜F・マリノス
        run: node scripts/fetch/marinos.mjs data/marinos.json
      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/marinos.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "chore: update schedule data"
            git push
          fi
