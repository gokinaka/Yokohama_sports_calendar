name: Deploy to GitHub Pages

# site/index.html と data/ を _site/ にまとめて GitHub Pages に公開する。
# 日次のデータ更新ワークフローが完了したときにも実行して、公開中のカレンダーを最新にする。
# (GitHub Actions が push したコミットは他のワークフローを起動しないため、workflow_run で受ける)
on:
  push:
    branches:
      - claude/sports-calendar-app-1h6mge
    paths:
      - "site/**"
      - "data/**"
      - "scripts/build-site.mjs"
      - ".github/workflows/deploy-pages.yml"
  workflow_run:
    workflows: ["Update schedule data"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 公開用ディレクトリを作成
        run: node scripts/build-site.mjs
      - name: Pagesを設定(未設定なら有効化)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: デプロイ
        id: deployment
        uses: actions/deploy-pages@v4
